[alembic]
# Diretorio das migracoes.
script_location = migracoes

# Nome de arquivo de cada revisao: numero sequencial (definido a mao em cada
# migracao, ex. "0001", "0002") + descricao curta. Nao usamos o hash aleatorio
# padrao do Alembic porque a ordem de leitura tem que ser obvia so pelo nome.
file_template = %%(rev)s_%%(slug)s

# NUNCA colocar a URL do banco aqui. migracoes/env.py le DATABASE_URL do
# ambiente em tempo de execucao — ver a funcao get_url() nesse arquivo.

# Fuso horario dos timestamps de revisao no changelog do Alembic.
timezone = UTC

truncate_slug_length = 40

# Nao versiona o .pyc das migracoes.
sourceless = false

version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
