# URL do banco vista de DENTRO da rede do compose (host "banco" = nome do servico
# abaixo). NAO e o DATABASE_URL do .env, que usa "localhost" para uso fora do
# container (Alembic rodado direto do host). Compartilhada por "migracao" e "api".
x-database-url: &database-url postgresql+psycopg://${POSTGRES_USER:-vip_imports}:${POSTGRES_PASSWORD:-vip_imports}@banco:5432/${POSTGRES_DB:-vip_imports}

services:
  banco:
    image: postgres:16
    container_name: vip-imports-banco
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vip_imports}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vip_imports}
      POSTGRES_DB: ${POSTGRES_DB:-vip_imports}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - banco_dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-vip_imports} -d $${POSTGRES_DB:-vip_imports}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Aplica `alembic upgrade head` UMA vez e sai. A api so sobe depois que isto
  # termina com sucesso (depends_on abaixo): banco desatualizado nunca chega a
  # atender requisicao, e uma migracao que falha derruba o `up` com o erro a vista
  # em vez de virar 500 em telas aleatorias. Fica fora do processo do uvicorn de
  # proposito: o --reload reinicia a api a cada edicao e varios workers rodariam
  # a migracao em paralelo; aqui existe exatamente um processo migrando.
  # Migracao nova criada no host: `docker compose up -d` (ou `docker compose run
  # --rm migracao`) aplica; nao precisa rebuildar a imagem.
  migracao:
    build: .
    image: vip-imports-api
    container_name: vip-imports-migracao
    restart: "no"
    environment:
      DATABASE_URL: *database-url
    volumes:
      # src/ e migracoes/ vivem na imagem (COPY do Dockerfile) e ficavam congelados
      # nela: arquivo novo no host era invisivel ao container ate alguem rebuildar.
      # Os dois precisam vir do host: o env.py importa vip_api.modelos (src/).
      - ./src:/app/src:ro
      - ./migracoes:/app/migracoes:ro
    command: ["alembic", "upgrade", "head"]
    depends_on:
      banco:
        condition: service_healthy

  api:
    build: .
    image: vip-imports-api
    container_name: vip-imports-api
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
      AMBIENTE: ${AMBIENTE:-desenvolvimento}
      ORIGENS_PERMITIDAS: ${ORIGENS_PERMITIDAS:-http://localhost:5173}
      NIVEL_LOG: ${NIVEL_LOG:-INFO}
      PROXIES_CONFIAVEIS: ${PROXIES_CONFIAVEIS:-}
      WHATSAPP_LOJA: ${WHATSAPP_LOJA:-}
      EMAILS_PRE_APROVADOS: ${EMAILS_PRE_APROVADOS:-}
      IMAGENS_DIR: ${IMAGENS_DIR:-./dados/imagens}
      IMAGENS_URL_BASE: ${IMAGENS_URL_BASE:-http://localhost:8000/midia}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Monta o codigo fonte por cima do que foi copiado na imagem — junto
      # com --reload abaixo, edicao no host reinicia o processo sozinho.
      - ./src:/app/src
      # Mesmo motivo do servico "migracao". Aqui sem :ro para que
      # `docker compose exec api alembic ...` enxergue (e possa gerar) revisoes.
      - ./migracoes:/app/migracoes
      # Imagem enviada pelo painel (upload de produto/banner). Volume nomeado,
      # nao bind mount: sobrevive a "docker compose down" e a rebuild da
      # imagem, e nao fica espalhado dentro da pasta do repo. Em producao,
      # troque por um volume que entre no backup — perder isto e perder toda
      # foto que o cliente subiu pelo painel, nao so a que a importacao em
      # lote gerou (essa o CSV original ainda tem).
      - imagens_painel:/app/dados/imagens
      # A fotografia dos fornecedores é somente leitura: decisões vivem no PostgreSQL,
      # nunca no JSON atualizado pelo importador.
      - ./data:/app/data:ro
    command: ["uvicorn", "vip_api.principal:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      banco:
        condition: service_healthy
      migracao:
        condition: service_completed_successfully

volumes:
  banco_dados:
  imagens_painel:
