# Publicação do backend — trilha de DevOps (Dev 4), tarefa 13.
#
# "Publicar uma versão nova precisa ser um comando só, ou automático ao enviar
# código para a branch principal."
#
#   merge na main  ->  testa, constrói a imagem, publica em HOMOLOGAÇÃO sozinho
#   produção       ->  Actions > Publicar > Run workflow > ambiente: producao
#
# Homologação automática e produção sob comando é o que permite publicar dez
# vezes por dia sem medo: o erro aparece no ensaio, não no site do cliente.
#
# Este workflow publica SÓ a API. O site tem o dele, no Frontend-VIP-IMPORTS, e
# os dois lados avançam sem esperar um pelo outro — por isso o deploy chama
# `publicar.sh <ambiente> --api <tag>`, que não encosta na versão do site.

name: Publicar

on:
  push:
    branches: [main]
    # Mexer em documentação não gera imagem nem deploy.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      ambiente:
        description: "Onde publicar"
        required: true
        default: homologacao
        type: choice
        options: [homologacao, producao]
      tag:
        description: "Versão já existente a publicar (SHA curto). Vazio = testa e constrói a partir deste commit."
        required: false
        type: string
      confirmar:
        description: "Para publicar em PRODUÇÃO, digite PUBLICAR. Ignorado em homologação."
        required: false
        default: ""
        type: string

# Um deploy por vez, e sem cancelar o que começou: interromper deploy no meio
# deixa o ambiente num estado que ninguém sabe descrever.
concurrency:
  group: publicar-backend
  cancel-in-progress: false

jobs:
  # A suíte inteira, reaproveitada de testes.yml. Pulada só quando o disparo
  # manual aponta para uma versão que JÁ existe — nesse caso ela já passou
  # quando aquela imagem foi construída, e rodar de novo testaria o código de
  # hoje contra uma imagem de ontem.
  testes:
    if: ${{ inputs.tag == '' }}
    uses: ./.github/workflows/testes.yml

  construir:
    needs: testes
    # `always()` porque `needs` de job pulado deixaria este pulado junto.
    if: ${{ always() && (needs.testes.result == 'success' || needs.testes.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.versao.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Definir a versão
        id: versao
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}"     >> "$GITHUB_OUTPUT"
            echo "construir=nao"             >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
            echo "construir=sim"                       >> "$GITHUB_OUTPUT"
          fi

      - name: Entrar no registro
        if: steps.versao.outputs.construir == 'sim'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Token do próprio job — não precisa de secret. Quem autoriza o push
          # da imagem é a permissão `packages: write` declarada acima.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nome do dono em minúsculas
        if: steps.versao.outputs.construir == 'sim'
        id: dono
        # O GHCR só aceita caminho minúsculo, e a organização é "No-Fear-BI".
        run: echo "nome=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
        if: steps.versao.outputs.construir == 'sim'

      - name: Construir e enviar a imagem
        if: steps.versao.outputs.construir == 'sim'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ steps.dono.outputs.nome }}/vip-imports-api:${{ steps.versao.outputs.tag }}
          # Cache entre execuções. Sem ele, cada push reinstala todas as
          # dependências do zero e o build passa de 4 minutos.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  homologacao:
    needs: construir
    if: ${{ github.event_name == 'push' || inputs.ambiente == 'homologacao' }}
    runs-on: ubuntu-latest
    environment:
      name: homologacao
      url: https://${{ vars.DOMINIO_HOMOLOGACAO }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/publicar-no-servidor
        with:
          ambiente: homologacao
          componente: api
          tag: ${{ needs.construir.outputs.tag }}
          servidor: ${{ secrets.SSH_SERVIDOR }}
          usuario: ${{ secrets.SSH_USUARIO }}
          chave: ${{ secrets.SSH_CHAVE }}
          hosts_conhecidos: ${{ secrets.SSH_HOSTS_CONHECIDOS }}
          porta: ${{ vars.SSH_PORTA }}
          caminho_infra: ${{ vars.CAMINHO_INFRA }}

  producao:
    needs: construir
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.ambiente == 'producao' }}
    runs-on: ubuntu-latest
    # O ambiente "producao" existe em Settings > Environments, mas a proteção
    # "Required reviewers" NÃO ESTÁ VALENDO: a organização está no GitHub Free
    # e, no Free, essa proteção (como branch protection e rulesets) só é
    # aplicada em repositório PÚBLICO. Em repositório privado ela aparece
    # configurada e fica "Not enforced" — pior que não ter, porque parece que
    # tem.
    #
    # Enquanto a organização não subir para o plano Team, a trava é a
    # confirmação digitada abaixo. Não substitui revisão de outra pessoa: o
    # que ela impede é o acidente — o clique errado no menu, o "Run workflow"
    # com o ambiente errado selecionado. Contra publicar sozinho de propósito,
    # o que vale é o acordo de processo da tarefa 14.
    environment:
      name: producao
      url: https://${{ vars.DOMINIO }}
    steps:
      - name: Conferir a confirmação
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirmar }}" != "PUBLICAR" ]; then
            echo "::error::Para publicar em produção, preencha o campo 'confirmar' com PUBLICAR."
            echo "Nada foi publicado. O site continua na versão anterior."
            exit 1
          fi
          echo "Confirmado. Publicando em produção."

      - uses: actions/checkout@v4
      - uses: ./.github/actions/publicar-no-servidor
        with:
          ambiente: producao
          componente: api
          tag: ${{ needs.construir.outputs.tag }}
          servidor: ${{ secrets.SSH_SERVIDOR }}
          usuario: ${{ secrets.SSH_USUARIO }}
          chave: ${{ secrets.SSH_CHAVE }}
          hosts_conhecidos: ${{ secrets.SSH_HOSTS_CONHECIDOS }}
          porta: ${{ vars.SSH_PORTA }}
          caminho_infra: ${{ vars.CAMINHO_INFRA }}
