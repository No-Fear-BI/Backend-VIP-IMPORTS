[project]
name = "vip-imports-backend"
version = "0.1.0"
description = "Backend da loja virtual VIP Imports (No Fear) — catalogo, identificacao de cliente e painel administrativo."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    # Hash da senha de administrador. Só aqui: o token de sessao continua
    # em SHA-256, que e barato e roda a cada requisicao autenticada.
    "argon2-cffi>=23.1,<26.0",
    # Redimensionar e converter para WebP em scripts/importar_catalogo.py
    # (carga da Fatia 5). O wheel manylinux traz libwebp/libjpeg embutidos —
    # não precisa de pacote de sistema extra na imagem python:3.12-slim.
    "pillow>=11.0,<12.0",
]

[project.optional-dependencies]
# Dependencias de DESENVOLVIMENTO. Instale com: pip install -e ".[dev]"
# Sem pytest-asyncio: a aplicacao e sincrona de ponta a ponta (ver banco.py) e
# o TestClient do Starlette tambem e — nao ha corrotina para orquestrar.
dev = [
    "pytest>=8.0",
    # O TestClient do Starlette e construido sobre o httpx; sem ele os testes
    # nem coletam.
    "httpx>=0.27",
]

[tool.pytest.ini_options]
# O pacote mora em src/ e nao esta instalado no ambiente: sem isto, o
# conftest nao acha vip_api.
pythonpath = ["src", "."]
testpaths = ["testes"]
# Arquivos e funcoes em portugues, como o resto do projeto.
python_files = ["teste_*.py"]
python_functions = ["teste_*"]
addopts = "-ra --strict-markers"
# Aviso novo é ERRO. Com 230 avisos conhecidos na tela, o aviso 231 — o que
# importa — passava despercebido. Os conhecidos ficam listados um a um, por
# categoria e começo da mensagem, com o motivo; na lista do pytest vale a
# ÚLTIMA regra que casar, por isso o "error" vem primeiro.
filterwarnings = [
    "error",
    # FastAPI 0.115 recria os campos dos corpos de requisição copiando o
    # `Field()`, e o pydantic >= 2.12 avisa que o alias gerado (camelCase, de
    # esquemas/base.py) não tem efeito nessa cópia. Tem: os testes provam que
    # os campos em camelCase entram. Some ao subir o FastAPI (pendências).
    "ignore:The 'alias' attribute with value:pydantic.warnings.UnsupportedFieldAttributeWarning",
    "ignore:The 'validation_alias' attribute with value:pydantic.warnings.UnsupportedFieldAttributeWarning",
    "ignore:The 'serialization_alias' attribute with value:pydantic.warnings.UnsupportedFieldAttributeWarning",
    # O TestClient do Starlette desta versão ainda usa o nome antigo do
    # BlockingPortal do anyio. Só aparece nos testes, nunca na aplicação.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vip_api"]
